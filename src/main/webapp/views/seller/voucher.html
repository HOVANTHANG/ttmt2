<body class="sb-nav-fixed">

            <main class="main">

                    <div>
                        <h4>Quản lý Voucher</h4>
                        <p>Tạo và quản lý các mã giảm giá cho shop của bạn</p>
                    </div>
                    <div class="ptc-actions">

                        </a>
                    </div>
                </div>

                <div class="filter-card">

                            </button>

                    </div>
                </div>

                                    <th>Đơn hàng tối thiểu</th>

                                    <th>Mức giảm</th>
                                    <th>Áp dụng</th>
                                    <th>Ngày bắt đầu</th>

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header" style="background: var(--p-grad); color: #fff; border: none; padding: 16px 24px;">
                    <h5 class="modal-title" id="voucherProductsModalLabel" style="font-weight: 700; font-size: 15px;">Sản phẩm áp dụng Voucher</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: brightness(0) invert(1);"></button>
                </div>
                <div class="modal-body" style="padding: 24px; max-height: 400px; overflow-y: auto;">
                    <div id="modal-products-list" style="display: flex; flex-direction: column; gap: 12px;">
                        <!-- JS renders products here -->
                    </div>
                </div>
                <div class="modal-footer" style="background: #f8fafc; border-top: 1px solid var(--border); padding: 12px 24px;">
