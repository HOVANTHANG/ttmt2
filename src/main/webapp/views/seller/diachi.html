<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Địa chỉ kho hàng - Seller Center</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link href="css/styles.css" rel="stylesheet" />
    <link href="/seller/css/seller-modern.css" rel="stylesheet" />
    <link href="/seller/css/diachikho.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.2.0/css/bootstrap.min.css"
        rel="stylesheet" />
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
    <script src="/seller/js/menu1.js"></script>
    <script src="/seller/js/addressshop.js"></script>


    <script>
        window.onload = function () {
            loadAddressShop();
            loadShopTinh();
        };
    </script>
    </head>

    <body class="sb-nav-fixed">
        <nav id="top" class="sb-topnav navbar navbar-expand navbar-dark bg-dark"></nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav"></div>
            <div id="layoutSidenav_content">
                <main class="main">

                    <div class="page-title-card">
                        <div class="page-title-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div>
                            <h4>Địa chỉ kho hàng</h4>
                            <p>Quản lý địa chỉ lấy hàng và trả hàng của shop</p>
                        </div>
                        <div class="ptc-actions">
                            <button onclick="clearShopAddressForm()" data-bs-toggle="modal"
                                data-bs-target="#modalShopAdd" class="btn btn-light btn-sm fw-bold">
                                <i class="fas fa-plus me-1"></i> Thêm địa chỉ
                            </button>
                        </div>
                    </div>

                    <div style="max-width:860px;">
                        <div id="listShopAddress">
                            <div class="empty-state">
                                <i class="fas fa-map-marked-alt"></i>
                                <div style="font-size:15px;font-weight:600;">Đang tải...</div>
                            </div>
                        </div>
                    </div>

                </main>
            </div>
        </div>

        <div class="modal fade" id="modalShopAdd" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content" style="border:none;border-radius:20px;overflow:hidden;">
                    <div class="modal-header modal-header-teal">
                        <h5 class="modal-title"><i class="fas fa-map-marker-alt me-2"></i>Địa chỉ kho hàng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="shopAddId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label-custom">Họ tên người liên hệ *</label>
                                <input id="shopAddName" class="form-control-custom" placeholder="Nhập họ tên">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">Số điện thoại *</label>
                                <input id="shopAddPhone" class="form-control-custom" placeholder="Nhập số điện thoại">
                            </div>
                            <div class="col-12">
                                <label class="form-label-custom">Tên đường, số nhà *</label>
                                <input id="shopAddStreet" class="form-control-custom"
                                    placeholder="Số nhà, tên đường...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-custom">Tỉnh / Thành phố</label>
                                <select id="shopAddTinh" class="form-control-custom"
                                    onchange="loadShopHuyen(this.value)">
                                    <option value="" disabled selected>-- Chọn tỉnh --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-custom">Quận / Huyện</label>
                                <select id="shopAddHuyen" class="form-control-custom" onchange="loadShopXa(this.value)">
                                    <option value="" hidden>---</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-custom">Phường / Xã</label>
                                <select id="shopAddXa" class="form-control-custom">
                                    <option value="" hidden>---</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <div class="custom-checkbox-wrapper">

                                    <input type="checkbox" id="shopAddPrimary">
                                    <span for="shopAddPrimary">Đặt làm địa chỉ mặc định</span>

                                </div>
                            </div>
                            <div class="col-12 mt-2">
                                <button class="btn-save-teal" onclick="saveShopAddress()">
                                    <i class="fas fa-save me-2"></i>Lưu địa chỉ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>

</html>
