<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý shop — Admin</title>

    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/shop.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.2.0/css/bootstrap.min.css"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    <script src="js/menu.js"></script>

</head>

<body class="sb-nav-fixed">
    <nav id="top" class="sb-topnav navbar navbar-expand navbar-dark bg-dark"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav"></div>
        <div id="layoutSidenav_content">
            <main class="container-fluid px-4">

                <div class="page-header">
                    <h3><i class="fas fa-store"></i> Quản lý cửa hàng</h3>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadShop()"
                        style="border-radius:10px;font-weight:600;">
                        <i class="fas fa-sync-alt"></i> Tải lại
                    </button>
                </div>

                <!-- Summary cards -->
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="summary-icon" style="background:#dcfce7;color:#16a34a;"><i
                                class="fas fa-check-circle"></i></div>
                        <div>
                            <div class="s-val" id="cntApproved">—</div>
                            <div class="s-lbl">Đang hoạt động</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon" style="background:#fff7ed;color:#ea580c;"><i class="fas fa-clock"></i>
                        </div>
                        <div>
                            <div class="s-val" id="cntPending">—</div>
                            <div class="s-lbl">Chờ duyệt</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon" style="background:#fee2e2;color:#dc2626;"><i class="fas fa-lock"></i>
                        </div>
                        <div>
                            <div class="s-val" id="cntRejected">—</div>
                            <div class="s-lbl">Đã khóa / Từ chối</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon" style="background:#ede9fe;color:#7c3aed;"><i class="fas fa-store"></i>
                        </div>
                        <div>
                            <div class="s-val" id="cntTotal">—</div>
                            <div class="s-lbl">Tổng cửa hàng</div>
                        </div>
                    </div>
                </div>

                <!-- Filter bar -->
                <div class="filter-bar mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm tên shop, slug..."
                        oninput="filterTable()" style="max-width:260px;">
                    <select id="statusFilter" class="form-select" onchange="filterTable()" style="max-width:180px;">
                        <option value="">Tất cả trạng thái</option>
                        <option value="APPROVED">✅ Đang hoạt động</option>
                        <option value="PENDING">⏳ Chờ duyệt</option>
                        <option value="REJECTED">❌ Đã từ chối</option>
                        <option value="LOCKED">🔒 Đã khóa</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="shop-card">
                    <div class="table-responsive">
                        <table class="table shop-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width:50px">ID</th>
                                    <th style="width:56px">Ảnh</th>
                                    <th>Tên shop</th>
                                    <th>Slug</th>
                                    <th>SĐT</th>
                                    <th>Trạng thái</th>
                                    <th style="width:240px">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="listShop">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Đang tải dữ liệu...</td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- Pagination bar -->
                        <div class="pagination-bar" id="paginationBar" style="display:none">
                            <div class="pagination-info" id="pageInfo"></div>
                            <div class="pg-nav" id="pgNav"></div>
                            <div class="per-page-wrap">
                                Hiển thị:
                                <select id="perPageSelect" onchange="onPerPageChange()">
                                    <option value="5">5</option>
                                    <option value="10" selected>10</option>
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                </select>
                                / trang
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmShopModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex align-items-center gap-3">
                        <div id="confirmIcon"
                            style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;">
                        </div>
                        <h5 class="modal-title fw-bold mb-0" id="confirmTitle"></h5>
                    </div>
                </div>
                <div class="modal-body" id="confirmBody" style="color:#4b5563;font-size:15px;padding:8px 24px;"></div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal"
                        style="border-radius:10px;font-weight:600;">Huỷ</button>
                    <button class="btn" id="confirmOkBtn"
                        style="border-radius:10px;font-weight:700;min-width:120px;"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shop Detail Modal -->
    <div class="modal fade" id="shopDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered" style="max-width:560px">
            <div class="modal-content">
                <!-- Header with gradient -->
                <div class="modal-header">
                    <div class="d-flex align-items-center gap-4 w-100">
                        <div class="detail-avatar-lg" id="detailAvatarWrap"></div>
                        <div style="flex:1;min-width:0">
                            <div
                                style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:4px;">
                                Chi tiết cửa hàng</div>
                            <div id="detailShopName"
                                style="font-size:20px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                            </div>
                            <div id="detailStatusBadge" style="margin-top:6px;"></div>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                </div>

                <!-- Stat chips -->
                <div class="detail-stat-row" style="padding-top:18px;">
                    <div class="detail-stat-chip">
                        <div class="sv" id="detailAvgStar">—</div>
                        <div class="sl">⭐ Đánh giá TB</div>
                    </div>
                    <div class="detail-stat-chip">
                        <div class="sv" id="detailReviewCount">—</div>
                        <div class="sl">💬 Lượt đánh giá</div>
                    </div>
                    <div class="detail-stat-chip">
                        <div class="sv" id="detailTotalSold">—</div>
                        <div class="sl">📦 Đã bán</div>
                    </div>
                    <div class="detail-stat-chip">
                        <div class="sv" id="detailCommission">—</div>
                        <div class="sl">💰 Hoa hồng (%)</div>
                    </div>
                </div>

                <!-- Info grid -->
                <div class="detail-info-grid">
                    <div class="detail-info-item">
                        <label><i class="fas fa-fingerprint" style="color:#0d9488"></i> Shop ID</label>
                        <div class="val" id="detailId">—</div>
                    </div>
                    <div class="detail-info-item">
                        <label><i class="fas fa-link" style="color:#0d9488"></i> Slug</label>
                        <div class="val"><code id="detailSlug"
                                style="background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:12.5px;">—</code>
                        </div>
                    </div>
                    <div class="detail-info-item">
                        <label><i class="fas fa-phone" style="color:#0d9488"></i> Số điện thoại</label>
                        <div class="val" id="detailPhone">—</div>
                    </div>
                    <div class="detail-info-item">
                        <label><i class="fas fa-envelope" style="color:#0d9488"></i> Email</label>
                        <div class="val" id="detailEmail" style="word-break:break-all;">—</div>
                    </div>
                    <div class="detail-info-item full">
                        <label><i class="fas fa-align-left" style="color:#0d9488"></i> Mô tả cửa hàng</label>
                        <div class="detail-desc-box" id="detailDescription">Chưa có mô tả.</div>
                    </div>
                </div>

                <div class="modal-footer" style="justify-content:flex-end;">
                    <button class="btn btn-light" data-bs-dismiss="modal"
                        style="border-radius:10px;font-weight:600;">Đóng</button>
                    <button class="btn" id="detailActionBtn"
                        style="border-radius:10px;font-weight:700;min-width:130px;"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE = 'http://localhost:8080';
        let allShops = [];
        let filteredShops = [];
        let currentPage = 1;
        let perPage = 10;

        toastr.options = {
            positionClass: 'toast-top-right',
            timeOut: 3500,
            closeButton: true,
            progressBar: true,
            newestOnTop: true
        };

        window.onload = function () {
            if (typeof loadMenu === 'function') loadMenu();
            loadShop();
        };

        function getToken() { return localStorage.getItem('token'); }

        async function loadShop() {
            const res = await fetch(BASE + '/api/admin/shop/all', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!res.ok) { toastr.error('Không tải được danh sách shop', 'Lỗi'); return; }
            allShops = await res.json();
            updateSummary(allShops);
            filteredShops = allShops;
            currentPage = 1;
            renderTable();
        }

        function updateSummary(list) {
            document.getElementById('cntTotal').textContent = list.length;
            document.getElementById('cntApproved').textContent = list.filter(s => s.status === 'APPROVED').length;
            document.getElementById('cntPending').textContent = list.filter(s => s.status === 'PENDING').length;
            document.getElementById('cntRejected').textContent = list.filter(s => s.status === 'REJECTED' || s.status === 'LOCKED').length;
        }

        function filterTable() {
            const kw = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            filteredShops = allShops.filter(s => {
                const matchKw = !kw
                    || (s.shopName || '').toLowerCase().includes(kw)
                    || (s.shopSlug || '').toLowerCase().includes(kw)
                    || (s.phone || '').includes(kw);
                const matchSt = !status || s.status === status;
                return matchKw && matchSt;
            });
            currentPage = 1;
            renderTable();
        }

        function onPerPageChange() {
            perPage = parseInt(document.getElementById('perPageSelect').value);
            currentPage = 1;
            renderTable();
        }

        function goPage(p) {
            const total = Math.ceil(filteredShops.length / perPage);
            if (p < 1 || p > total) return;
            currentPage = p;
            renderTable();
        }

        function renderTable() {
            const list = filteredShops;
            const totalPages = Math.max(1, Math.ceil(list.length / perPage));
            if (currentPage > totalPages) currentPage = totalPages;

            // pagination bar visibility
            const bar = document.getElementById('paginationBar');
            bar.style.display = list.length ? 'flex' : 'none';

            if (!list.length) {
                document.getElementById('listShop').innerHTML =
                    `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-store-slash"></i><div>Không tìm thấy shop nào</div></div></td></tr>`;
                renderPagination(0, 0);
                return;
            }

            // slice for current page
            const start = (currentPage - 1) * perPage;
            const end = Math.min(start + perPage, list.length);
            const pageList = list.slice(start, end);

            // update info
            document.getElementById('pageInfo').innerHTML =
                `Hiển thị <span>${start + 1}–${end}</span> / <span>${list.length}</span> cửa hàng`;

            renderPagination(totalPages, currentPage);

            let html = '';
            pageList.forEach(s => {
                const initial = (s.shopName || 'S').charAt(0).toUpperCase();
                const avatar = s.avatar
                    ? `<img src="${s.avatar}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:12px;">
                       <span class="shop-av-initial" style="display:none">${initial}</span>`
                    : `<span class="shop-av-initial">${initial}</span>`;

                const statusBadge = {
                    APPROVED: `<span class="badge-status badge-approved"><i class="fas fa-check-circle"></i> Hoạt động</span>`,
                    PENDING: `<span class="badge-status badge-pending"><i class="fas fa-clock"></i> Chờ duyệt</span>`,
                    REJECTED: `<span class="badge-status badge-rejected" style="background:#fee2e2;color:#dc2626;"><i class="fas fa-times-circle"></i> Từ chối</span>`,
                    LOCKED: `<span class="badge-status badge-rejected"><i class="fas fa-lock"></i> Đã khóa</span>`
                }[s.status] || `<span class="badge-status badge-pending">${s.status}</span>`;

                const actionBtn = (s.status === 'APPROVED' || s.status === 'PENDING')
                    ? `<button class="btn-lock" onclick="confirmAction(${s.id}, 'lock', '${escHtml(s.shopName)}')">
                          <i class="fas fa-lock"></i> Khóa shop
                       </button>`
                    : `<button class="btn-unlock" onclick="confirmAction(${s.id}, 'unlock', '${escHtml(s.shopName)}')">
                          <i class="fas fa-lock-open"></i> Mở khóa
                       </button>`;

                html += `
                    <tr data-status="${s.status}">
                        <td><span class="stat-pill">#${s.id}</span></td>
                        <td>
                            <div class="shop-av-wrap" style="position:relative;">
                                ${avatar}
                            </div>
                        </td>
                        <td>
                            <div style="font-weight:700;color:#111827;">${escHtml(s.shopName || '')}</div>
                            <div style="font-size:11.5px;color:#94a3b8;margin-top:2px;">${escHtml(s.email || '')}</div>
                        </td>
                        <td><code style="background:#f1f5f9;padding:2px 7px;border-radius:6px;font-size:12px;">${escHtml(s.shopSlug || '')}</code></td>
                        <td>${escHtml(s.phone || '—')}</td>
                        <td>${statusBadge}</td>
                        <td style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                            <button class="btn-detail" onclick="showDetail(${s.id})">
                                <i class="fas fa-eye"></i> Chi tiết
                            </button>
                            ${actionBtn}
                        </td>
                    </tr>`;
            });
            document.getElementById('listShop').innerHTML = html;
        }

        function renderPagination(totalPages, cur) {
            const nav = document.getElementById('pgNav');
            if (totalPages <= 1) { nav.innerHTML = ''; return; }

            let btns = '';

            // Prev
            btns += `<button class="pg-btn" onclick="goPage(${cur - 1})" ${cur === 1 ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left" style="font-size:11px"></i>
                     </button>`;

            // Page numbers with ellipsis
            const pages = buildPageRange(cur, totalPages);
            pages.forEach(p => {
                if (p === '...') {
                    btns += `<span class="pg-btn pg-dots">…</span>`;
                } else {
                    btns += `<button class="pg-btn ${p === cur ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                }
            });

            // Next
            btns += `<button class="pg-btn" onclick="goPage(${cur + 1})" ${cur === totalPages ? 'disabled' : ''}>
                        <i class="fas fa-chevron-right" style="font-size:11px"></i>
                     </button>`;

            nav.innerHTML = btns;
        }

        function buildPageRange(cur, total) {
            if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
            const pages = [];
            if (cur <= 4) {
                for (let i = 1; i <= 5; i++) pages.push(i);
                pages.push('...'); pages.push(total);
            } else if (cur >= total - 3) {
                pages.push(1); pages.push('...');
                for (let i = total - 4; i <= total; i++) pages.push(i);
            } else {
                pages.push(1); pages.push('...');
                for (let i = cur - 1; i <= cur + 1; i++) pages.push(i);
                pages.push('...'); pages.push(total);
            }
            return pages;
        }

        // ── Confirm modal ──
        function showConfirm({ title, body, okText, okClass, iconHtml, iconBg, onOk }) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').innerHTML = body;
            const iconEl = document.getElementById('confirmIcon');
            iconEl.innerHTML = iconHtml || '';
            iconEl.style.background = iconBg || '#f1f5f9';

            const oldBtn = document.getElementById('confirmOkBtn');
            const newBtn = oldBtn.cloneNode(true);
            oldBtn.parentNode.replaceChild(newBtn, oldBtn);
            newBtn.textContent = okText;
            newBtn.className = 'btn ' + (okClass || 'btn-primary');
            newBtn.style.cssText = 'border-radius:10px;font-weight:700;min-width:120px;';
            newBtn.addEventListener('click', () => {
                bootstrap.Modal.getInstance(document.getElementById('confirmShopModal')).hide();
                if (typeof onOk === 'function') onOk();
            });

            new bootstrap.Modal(document.getElementById('confirmShopModal')).show();
        }

        function confirmAction(id, action, shopName) {
            const isLock = action === 'lock';
            showConfirm({
                title: isLock ? 'Khóa cửa hàng' : 'Mở khóa cửa hàng',
                body: isLock
                    ? `Bạn có chắc muốn <strong>khóa</strong> shop <em>"${shopName}"</em>?<br>
                       <span style="color:#dc2626;font-size:13px;">⚠ Toàn bộ sản phẩm của shop sẽ bị ẩn khỏi sàn.</span>`
                    : `Bạn có chắc muốn <strong>mở khóa</strong> shop <em>"${shopName}"</em>?<br>
                       <span style="color:#16a34a;font-size:13px;">✅ Toàn bộ sản phẩm của shop sẽ được khôi phục.</span>`,
                okText: isLock ? '🔒 Xác nhận khóa' : '🔓 Xác nhận mở khóa',
                okClass: isLock ? 'btn-danger' : 'btn-success',
                iconHtml: isLock
                    ? '<i class="fas fa-lock" style="color:#dc2626"></i>'
                    : '<i class="fas fa-lock-open" style="color:#16a34a"></i>',
                iconBg: isLock ? '#fee2e2' : '#dcfce7',
                onOk: () => doAction(id, action)
            });
        }

        async function doAction(id, action) {
            const token = getToken();
            try {
                const res = await fetch(`${BASE}/api/admin/shop/${id}/${action}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (action === 'lock') {
                        toastr.warning(data.message || 'Shop đã bị khóa!', '🔒 Đã khóa');
                    } else {
                        toastr.success(data.message || 'Shop đã được mở khóa!', '🔓 Đã mở khóa');
                    }
                    loadShop(); // refresh table
                } else {
                    const txt = await res.text();
                    toastr.error(txt || 'Thao tác thất bại', 'Lỗi');
                }
            } catch (e) {
                toastr.error('Không thể kết nối server', 'Lỗi');
            }
        }

        // ── Shop Detail Modal ──
        function showDetail(id) {
            const s = allShops.find(x => x.id === id);
            if (!s) return;

            // Avatar
            const initial = (s.shopName || 'S').charAt(0).toUpperCase();
            const wrap = document.getElementById('detailAvatarWrap');
            if (s.avatar) {
                wrap.innerHTML = `<img src="${s.avatar}" onerror="this.parentNode.innerHTML='<span class=detail-avatar-initial>${initial}</span>'" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                wrap.innerHTML = `<span class="detail-avatar-initial">${initial}</span>`;
            }

            // Header
            document.getElementById('detailShopName').textContent = s.shopName || '—';
            const statusMap = {
                APPROVED: `<span class="badge-status badge-approved" style="font-size:11px;"><i class="fas fa-check-circle"></i> Đang hoạt động</span>`,
                PENDING: `<span class="badge-status badge-pending"  style="font-size:11px;"><i class="fas fa-clock"></i> Chờ duyệt</span>`,
                REJECTED: `<span class="badge-status badge-rejected" style="font-size:11px;background:#fee2e2;color:#dc2626;"><i class="fas fa-times-circle"></i> Từ chối</span>`,
                LOCKED: `<span class="badge-status badge-rejected" style="font-size:11px;"><i class="fas fa-lock"></i> Đã khóa</span>`
            };
            document.getElementById('detailStatusBadge').innerHTML = statusMap[s.status] || s.status;

            // Stats
            const star = (s.avgStar != null) ? parseFloat(s.avgStar).toFixed(1) : '—';
            document.getElementById('detailAvgStar').textContent = star;
            document.getElementById('detailReviewCount').textContent = s.reviewCount ?? '—';
            document.getElementById('detailTotalSold').textContent = s.totalSold ?? '—';
            document.getElementById('detailCommission').textContent = (s.commissionRate != null) ? s.commissionRate + '%' : '—';

            // Info
            document.getElementById('detailId').textContent = '#' + s.id;
            document.getElementById('detailSlug').textContent = s.shopSlug || '—';
            document.getElementById('detailPhone').textContent = s.phone || '—';
            document.getElementById('detailEmail').textContent = s.email || '—';
            document.getElementById('detailDescription').textContent = s.description || 'Chưa có mô tả.';

            // Action button in modal footer
            const isLocked = s.status === 'LOCKED' || s.status === 'REJECTED';
            const btn = document.getElementById('detailActionBtn');
            btn.style.display = 'inline-block';
            btn.className = 'btn ' + (isLocked ? 'btn-success' : 'btn-danger');
            btn.innerHTML = isLocked
                ? '<i class="fas fa-lock-open"></i> Mở khóa shop'
                : '<i class="fas fa-lock"></i> Khóa shop';
            // Remove old listener then add new one
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', () => {
                bootstrap.Modal.getInstance(document.getElementById('shopDetailModal')).hide();
                confirmAction(s.id, isLocked ? 'unlock' : 'lock', s.shopName);
            });

            new bootstrap.Modal(document.getElementById('shopDetailModal')).show();
        }

        function escHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
