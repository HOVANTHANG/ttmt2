    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/product-approval.css" rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.2/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.2/js/dataTables.bootstrap5.min.js"></script>
    <link href="https://cdn.datatables.net/1.13.2/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.2.0/css/bootstrap.min.css"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
    <!-- Menu & Auth -->
    <script src="js/menu.js"></script>
    <script src="js/product-approval.js"></script>


    </head>

    <body class="sb-nav-fixed">
        <nav id="top" class="sb-topnav navbar navbar-expand navbar-dark bg-dark"></nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav"></div>
            <div id="layoutSidenav_content">
                <main>

                    <!-- Page Header -->
                    <div class="pa-page-header">
                        <div class="pa-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                        <div>
                            <h1>Duyệt Sản Phẩm</h1>
                            <p>Xem xét và phê duyệt các sản phẩm mới từ cửa hàng</p>
                        </div>
                        <span class="pa-badge-count" id="pendingBadge" style="display:none;">0</span>
                    </div>

                    <!-- Toolbar -->
                    <div class="pa-toolbar">
                        <div class="pa-search-wrap">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchPendingInput" placeholder="Tìm theo tên hoặc mã sản phẩm..." />
                            <button class="pa-btn-search" onclick="searchPending()">Tìm</button>
                        </div>
                        <button class="pa-btn-search" style="border-radius:8px;padding:9px 18px;"
                            onclick="loadPendingProducts(0,'')">
                            <i class="fa-solid fa-rotate-right"></i> Tải lại
                        </button>
                    </div>

                    <!-- Table -->
                    <div class="pa-table-wrap">
                        <table class="pa-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Cửa hàng</th>
                                    <th>Danh mục</th>
                                    <th>Thương hiệu</th>
                                    <th>Ngày tạo</th>
                                    <th style="text-align:center;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="pendingList">
                                <tr>
                                    <td colspan="8" class="pa-state">
                                        <div class="pa-spinner"></div>
                                        <span>Đang tải dữ liệu...</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="pa-pagination">
                        <nav>
                            <ul class="pagination" id="pendingPagination"></ul>
                        </nav>
                    </div>

                </main>
            </div>
        </div>

        <!-- Modal Từ Chối -->
        <div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius:14px;overflow:hidden;">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fa-solid fa-circle-xmark me-2"></i>Từ Chối Sản Phẩm
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" style="padding:22px;">
                        <div class="reject-product-name" id="rejectProductName"></div>
                        <label style="font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;display:block;">
                            Lý do từ chối <span style="color:#9ca3af;font-weight:400;">(tuỳ chọn)</span>
                        </label>
                        <textarea id="rejectReason" class="form-control"
                            placeholder="Ví dụ: Hình ảnh không rõ ràng, mô tả không đầy đủ..."></textarea>
                        <p style="font-size:.78rem;color:#6b7280;margin-top:8px;">
                            <i class="fa-solid fa-circle-info me-1"></i>
                            Lý do sẽ được gửi thông báo đến cửa hàng để họ chỉnh sửa lại.
                        </p>
                    </div>
                    <div class="modal-footer" style="border-top:1px solid #e5e7eb;gap:8px;">
                        <button type="button" data-bs-dismiss="modal"
                            style="background:#f3f4f6;color:#374151;border:none;border-radius:8px;padding:9px 20px;font-weight:600;cursor:pointer;">
                            Huỷ bỏ
                        </button>
                        <button class="btn-confirm-reject" onclick="confirmReject()">
                            <i class="fa-solid fa-circle-xmark me-1"></i>Xác nhận từ chối
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Chi Tiết Sản Phẩm -->
        <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content" style="border-radius:14px;overflow:hidden;">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fa-solid fa-box-open me-2"></i>Chi Tiết Sản Phẩm
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="detailBody">
                        <!-- Nội dung được render bởi JS -->
                    </div>
                </div>
            </div>
        </div>

    </body>

</html>
